name: Native iOS Open Food Facts cache budget

on:
  push:
    branches: [verify/native-off-cache-budget-ios]

permissions:
  contents: read

jobs:
  ios:
    name: Measure and reopen the iOS packaged-food cache
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sample the verified immutable Open Food Facts artifact
        run: |
          sha=1d42c90ae68d1e04af34c17b7586b640a4c4d4c7ec7ebbe721bcffe2a007ddbe
          source="$RUNNER_TEMP/open-food-facts.sqlite"
          curl -fLSs --retry 2 --max-time 90 "https://edo.timweb.app/catalog-preview/open-food-facts/artifacts/$sha.sqlite" -o "$source"
          echo "$sha  $source" | shasum -a 256 -c -
          node .github/scripts/generate-native-off-cache-fixture.mjs "$source"
      - name: Generate iOS and install pods
        working-directory: apps/mobile
        run: |
          pnpm exec expo prebuild --platform ios --no-install
          pod install --project-directory=ios
      - name: Boot an iPhone simulator
        run: |
          device=$(xcrun simctl list devices available -j | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { devices } = JSON.parse(readFileSync(0, "utf8"));
            const model = devices["com.apple.CoreSimulator.SimRuntime.iOS-26-5"]
              ?.find(({ name }) => name === "iPhone 17");
            if (!model) throw new Error("No iPhone 17 running iOS 26.5");
            console.log(model.udid);
          ')
          xcrun simctl bootstatus "$device" -b
          echo "EDO_SIMULATOR=$device" >> "$GITHUB_ENV"
      - name: Build the iOS simulator app
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -quiet -workspace Edo.xcworkspace -scheme Edo \
            -configuration Release -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$EDO_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/edo-ios" build
      - name: Measure the local cache across process restart
        run: |
          app="$RUNNER_TEMP/edo-ios/Build/Products/Release-iphonesimulator/Edo.app"
          xcrun simctl install "$EDO_SIMULATOR" "$app"
          bash .github/scripts/probe-native-off-cache-budget.sh ios
