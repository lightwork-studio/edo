name: Open Food Facts cache iOS verification

on:
  push:
    branches: [verify/native-off-packaged-cache-ios]

permissions:
  contents: read

jobs:
  ios:
    name: Retain logged and favorite products across an isolated catalog outage
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate iOS and install pods
        working-directory: apps/mobile
        run: |
          xcodebuild -version
          pnpm exec expo prebuild --platform ios --no-install
          pod install --project-directory=ios
          if ! ruby -e 'require "xcodeproj"'; then
            gem install xcodeproj --version 1.27.0 --user-install --no-document
          fi
          cp ../../.github/scripts/OfflineSmokeUITests.swift ios/
          ruby ../../.github/scripts/add-offline-smoke-target.rb ios/Edo.xcodeproj
      - name: Choose and boot an iPhone simulator
        run: |
          device=$(xcrun simctl list devices available -j | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { devices } = JSON.parse(readFileSync(0, "utf8"));
            const runtime = "com.apple.CoreSimulator.SimRuntime.iOS-26-5";
            const iphone = (devices[runtime] ?? []).find(({ name }) => name === "iPhone 17");
            if (!iphone) throw new Error("The runner has no iPhone 17 with iOS 26.5");
            console.error("Testing iOS 26.5 on " + iphone.name);
            console.log(iphone.udid);
          ')
          xcrun simctl bootstatus "$device" -b
          echo "EDO_SIMULATOR=$device" >> "$GITHUB_ENV"
      - name: Build and prime the cache through the public catalog
        env:
          EXPO_PUBLIC_EDO_CATALOG_ORIGIN: https://edo.timweb.app
          EXPO_PUBLIC_EDO_BLS_PREVIEW_ORIGIN: ''
          EXPO_PUBLIC_EDO_BLS_PREVIEW_SHA256: ''
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -quiet -workspace Edo.xcworkspace -scheme OfflineSmoke \
            -configuration Release -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$EDO_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/edo-online" build-for-testing
          bash ../../../.github/scripts/run-ios-cache-phase.sh edo-online testPrimeOnline

          data=$(xcrun simctl get_app_container "$EDO_SIMULATOR" studio.lightwork.edo data)
          cache=$(find "$data" -name edo-packaged-foods.db -type f)
          test -f "$cache"
          stat -f 'iOS two-product cache %z bytes' "$cache"
          echo "EDO_DATA_CONTAINER=$data" >> "$GITHUB_ENV"
      - name: Verify the existing device cache with an unreachable catalog
        env:
          EXPO_PUBLIC_EDO_CATALOG_ORIGIN: https://127.0.0.1:9
          EXPO_PUBLIC_EDO_BLS_PREVIEW_ORIGIN: ''
          EXPO_PUBLIC_EDO_BLS_PREVIEW_SHA256: ''
        working-directory: apps/mobile/ios
        run: |
          if nc -z -w 2 127.0.0.1 9; then
            echo 'The isolated catalog endpoint must be unreachable'
            exit 1
          fi
          xcodebuild -quiet -workspace Edo.xcworkspace -scheme OfflineSmoke \
            -configuration Release -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$EDO_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/edo-outage" build-for-testing
          bash ../../../.github/scripts/run-ios-cache-phase.sh edo-outage testCatalogOutage
          test "$EDO_DATA_CONTAINER" = "$(xcrun simctl get_app_container "$EDO_SIMULATOR" studio.lightwork.edo data)"
      - name: Keep the iOS UI test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-packaged-cache-smoke
          path: ${{ runner.temp }}/edo-*.xcresult
          if-no-files-found: ignore
          retention-days: 3
