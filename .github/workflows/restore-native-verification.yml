name: Restore native verification

on:
  push:
    branches: [verify/restore-native-5be328a]

permissions:
  contents: read

jobs:
  ios:
    name: Build and launch on iOS Simulator
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate iOS and install pods
        working-directory: apps/mobile
        run: |
          xcodebuild -version
          pnpm exec expo prebuild --platform ios --no-install
          pod install --project-directory=ios
      - name: Compile the unsigned simulator app
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -quiet -workspace Edo.xcworkspace -scheme Edo \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/edo-ios" CODE_SIGNING_ALLOWED=NO build
      - name: Launch the built app in an iPhone simulator
        run: |
          device=$(xcrun simctl list devices available -j | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { devices } = JSON.parse(readFileSync(0, "utf8"));
            const iphone = Object.values(devices).flat().find(({ name }) => name.startsWith("iPhone"));
            if (!iphone) throw new Error("The runner has no available iPhone simulator");
            console.log(iphone.udid);
          ')
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/edo-ios/Build/Products/Release-iphonesimulator/Edo.app"
          xcrun simctl launch "$device" studio.lightwork.edo
  android:
    name: Build Android and test the native reader
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Android
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Compile and test the native module
        working-directory: apps/mobile/android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          ./gradlew :edo-archive-picker:testDebugUnitTest :app:assembleDebug \
            --console=plain -PreactNativeArchitectures=x86_64
