name: Refresh Open Food Facts catalog
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-open-food-facts-production
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && vars.EDO_CATALOG_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: catalog-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify and publish updated catalog
        env:
          EDO_R2_ACCOUNT_ID: ${{ vars.EDO_R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.EDO_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EDO_R2_SECRET_ACCESS_KEY }}
        run: node apps/catalog-edge/publish.ts nightly
