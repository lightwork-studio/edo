name: Android Today barcode shortcut verification

on:
  push:
    branches: [verify/native-today-barcode]

permissions:
  contents: read

jobs:
  android:
    name: Verify the direct scanner and offline fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare the Android emulator
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/edo-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          image='system-images;android-35;google_apis;x86_64'
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          "$tools/sdkmanager" --install emulator "$image"
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          "$tools/avdmanager" create avd --name edo-offline --package "$image" \
            --path "$ANDROID_AVD_HOME/edo-offline.avd" <<< no
          test -f "$ANDROID_AVD_HOME/edo-offline.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx edo-offline
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Android
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Build the Android release APK
        working-directory: apps/mobile/android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          ./gradlew :app:assembleRelease \
            --console=plain -PreactNativeArchitectures=x86_64
      - name: Verify permission handoff, manual search and historical diary return
        run: |
          set -o pipefail
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx edo-offline
          "$ANDROID_HOME/emulator/emulator" -avd edo-offline -no-window -no-audio \
            -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              tail -80 "$RUNNER_TEMP/emulator.log"
              timeout 10 adb logcat -d -t 120 -s AndroidRuntime ReactNativeJS || true
            fi
            kill "$emulator_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          boot_deadline=$((SECONDS + 240))
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; do
            kill -0 "$emulator_pid"
            test "$SECONDS" -lt "$boot_deadline"
            sleep 2
          done
          adb shell wm dismiss-keyguard
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          python3 -u .github/scripts/android-today-barcode-smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: edo-today-barcode
          path: ${{ runner.temp }}/edo-today-barcode/*.png
          if-no-files-found: ignore
          retention-days: 14
