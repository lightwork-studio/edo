name: Edo Preflight
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: Build a new TestFlight binary even when its runtime already exists
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.repository == 'lightwork-studio/edo' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Verify the exact checked main revision
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$tip" != "$TARGET" ]; then
            echo "A newer main revision is available. Skipping this release."
            exit 0
          fi
          checked="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$TARGET" -f status=success \
            --jq '.total_count > 0')"
          if [ "$checked" != true ]; then
            echo "::error::CI has not passed on this main revision."
            exit 1
          fi
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"

  publish:
    needs: verify
    if: needs.verify.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: edo-preflight
    concurrency:
      group: edo-preflight-ios
      queue: max
    steps:
      - name: Check whether publishing is enabled
        id: release
        shell: bash
        env:
          PREFLIGHT_ENABLED: ${{ vars.EDO_PREFLIGHT_ENABLED }}
        run: |
          if [ "$PREFLIGHT_ENABLED" = true ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Preflight publishing is paused in its GitHub environment.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.release.outputs.enabled == 'true'
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.release.outputs.enabled == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.release.outputs.enabled == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        if: steps.release.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Publish an update or submit a native build
        if: steps.release.outputs.enabled == 'true'
        working-directory: apps/mobile
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          TARGET: ${{ needs.verify.outputs.sha }}
          FORCE_BUILD: ${{ inputs.force_build == true }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$ASC_API_KEY_P8" ]; then
            export ASC_API_KEY_PATH
            ASC_API_KEY_PATH="$(mktemp "$RUNNER_TEMP/edo-asc.XXXXXX")"
            trap 'rm -f "$ASC_API_KEY_PATH"' EXIT
            node -e '
              const fs = require("node:fs");
              const key = process.env.ASC_API_KEY_P8.replaceAll("\\n", "\n").trim();
              fs.writeFileSync(process.env.ASC_API_KEY_PATH, key + "\n", { mode: 0o600 });
            '
          fi
          unset ASC_API_KEY_P8
          bash scripts/publish-preflight.sh
