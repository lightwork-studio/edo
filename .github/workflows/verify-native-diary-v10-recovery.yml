name: Native diary v10 migration recovery

on:
  push:
    branches: [verify/native-diary-v10-weigh-ins]

permissions:
  contents: read

jobs:
  android:
    name: Recover a terminated Android diary migration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare the Android emulator
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/edo-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          image='system-images;android-35;google_apis;x86_64'
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          "$tools/sdkmanager" --install emulator "$image"
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          "$tools/avdmanager" create avd --name edo-offline --package "$image" \
            --path "$ANDROID_AVD_HOME/edo-offline.avd" <<< no
          test -f "$ANDROID_AVD_HOME/edo-offline.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx edo-offline
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node .github/scripts/generate-native-diary-fixture.mjs
      - name: Generate Android
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Build the Android release APK
        working-directory: apps/mobile/android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          ./gradlew :app:assembleRelease \
            --console=plain -PreactNativeArchitectures=x86_64
      - name: Interrupt and recover the Android diary migration
        run: |
          set -o pipefail
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx edo-offline
          "$ANDROID_HOME/emulator/emulator" -avd edo-offline -no-window -no-audio \
            -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              tail -80 "$RUNNER_TEMP/emulator.log"
              timeout 10 adb logcat -d -t 120 -s AndroidRuntime ReactNativeJS || true
            fi
            kill "$emulator_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          boot_deadline=$((SECONDS + 240))
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; do
            kill -0 "$emulator_pid"
            test "$SECONDS" -lt "$boot_deadline"
            sleep 2
          done
          adb shell wm dismiss-keyguard
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          bash .github/scripts/probe-native-diary-recovery.sh android

  ios:
    name: Recover a terminated iOS diary migration
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node .github/scripts/generate-native-diary-fixture.mjs
      - name: Generate iOS and install pods
        working-directory: apps/mobile
        run: |
          pnpm exec expo prebuild --platform ios --no-install
          pod install --project-directory=ios
      - name: Boot an iPhone simulator
        run: |
          device=$(xcrun simctl list devices available -j | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { devices } = JSON.parse(readFileSync(0, "utf8"));
            const model = devices["com.apple.CoreSimulator.SimRuntime.iOS-26-5"]
              ?.find(({ name }) => name === "iPhone 17");
            if (!model) throw new Error("No iPhone 17 running iOS 26.5");
            console.log(model.udid);
          ')
          xcrun simctl bootstatus "$device" -b
          echo "EDO_SIMULATOR=$device" >> "$GITHUB_ENV"
      - name: Build the iOS simulator app
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -quiet -workspace Edo.xcworkspace -scheme Edo \
            -configuration Release -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$EDO_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/edo-ios" build
      - name: Interrupt and recover the iOS diary migration
        run: |
          app="$RUNNER_TEMP/edo-ios/Build/Products/Release-iphonesimulator/Edo.app"
          xcrun simctl install "$EDO_SIMULATOR" "$app"
          bash .github/scripts/probe-native-diary-recovery.sh ios
