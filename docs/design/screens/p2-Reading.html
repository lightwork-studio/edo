<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Edo reading your photo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#141517}
button,input{font:inherit;color:inherit;margin:0}
a{color:#F6B84D}a:hover{color:#F9CD80}
.sk{border-radius:7px;background:linear-gradient(90deg,#26272B 0%,#313236 50%,#26272B 100%);background-size:480px 100%;animation:edo-shimmer 1.4s linear infinite}
@keyframes edo-shimmer{0%{background-position:-240px 0}100%{background-position:240px 0}}
@keyframes edo-spin{to{transform:rotate(360deg)}}
@keyframes edo-scan{0%{transform:translateX(-120px)}100%{transform:translateX(480px)}}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #141517; color: #F4F2EE; font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.3; -webkit-font-smoothing: antialiased">

  <header style="position: relative; padding: 8px 12px 0; height: 60px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between">
    <button type="button" aria-label="Cancel and close" style="width: 40px; height: 40px; flex: none; border-radius: 20px; border: 0; padding: 0; background: #1F2023; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F2EE" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <div style="position: absolute; left: 64px; right: 64px; top: 8px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center">
      <button type="button" aria-label="Meal: dinner. Change meal" style="height: 26px; border: 0; background: none; padding: 0; display: flex; align-items: center; gap: 5px; font-size: 17px; font-weight: 700; color: #F4F2EE; cursor: pointer">
        Dinner
        <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B0ACA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <span style="font-size: 12px; color: #B0ACA5">Wed, 25 Nov · 19:30</span>
    </div>
    <span aria-hidden="true" style="width: 40px"></span>
  </header>

  <figure style="margin: 12px 16px 0; padding: 8px 8px 0; border-radius: 22px; background: #1F2023">
    <div role="img" aria-label="Your photo: spaghetti bolognese, a side salad and a glass of water" style="position: relative; height: 180px; border-radius: 16px; overflow: hidden">

      <span aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 0; width: 90px; background: linear-gradient(90deg, rgba(246, 184, 77, 0), rgba(246, 184, 77, 0.22), rgba(246, 184, 77, 0)); animation: edo-scan 1.8s ease-in-out infinite"></span>
    </div>
    <figcaption style="height: 44px; padding: 0 2px 0 6px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #B0ACA5">
      <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B0ACA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg>
      <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">You added: <span lang="de" style="font-weight: 600; color: #F4F2EE">„mit Parmesan“</span></span>
      <button type="button" style="height: 44px; border: 0; background: none; padding: 0 8px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #F4F2EE; cursor: pointer">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F4F2EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>
        Edit note
      </button>
    </figcaption>
  </figure>

  <section aria-label="Finding items" aria-busy="true" style="margin: 18px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <div role="status" style="display: flex; align-items: center; gap: 10px; padding: 0 4px 2px; height: 20px">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="flex: none; animation: edo-spin 0.9s linear infinite"><circle cx="12" cy="12" r="9" fill="none" stroke="#2C2D31" stroke-width="3"></circle><path d="M12 3a9 9 0 0 1 9 9" fill="none" stroke="#F6B84D" stroke-width="3" stroke-linecap="round"></path></svg>
      <span style="font-size: 15px; font-weight: 600">Looking at your photo…</span>
    </div>

    <div aria-hidden="true" style="border-radius: 18px; background: #1F2023; padding: 12px 14px 12px 12px; display: flex; align-items: center; gap: 12px">
      <span class="sk" style="width: 40px; height: 40px; flex: none; border-radius: 12px"></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 10px"><span class="sk" style="width: 130px; height: 14px"></span><span class="sk" style="width: 96px; height: 24px; border-radius: 12px"></span></span>
      <span class="sk" style="width: 52px; height: 16px"></span>
    </div>
    <div aria-hidden="true" style="border-radius: 18px; background: #1F2023; padding: 12px 14px 12px 12px; display: flex; align-items: center; gap: 12px; opacity: 0.75">
      <span class="sk" style="width: 40px; height: 40px; flex: none; border-radius: 12px"></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 10px"><span class="sk" style="width: 104px; height: 14px"></span><span class="sk" style="width: 84px; height: 24px; border-radius: 12px"></span></span>
      <span class="sk" style="width: 52px; height: 16px"></span>
    </div>
    <div aria-hidden="true" style="border-radius: 18px; background: #1F2023; padding: 12px 14px 12px 12px; display: flex; align-items: center; gap: 12px; opacity: 0.5">
      <span class="sk" style="width: 40px; height: 40px; flex: none; border-radius: 12px"></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 10px"><span class="sk" style="width: 118px; height: 14px"></span><span class="sk" style="width: 90px; height: 24px; border-radius: 12px"></span></span>
      <span class="sk" style="width: 52px; height: 16px"></span>
    </div>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 34px; background: #141517; border-top: 1px solid #232427; display: flex; flex-direction: column; gap: 12px">
    <div style="padding: 0 4px; font-size: 13px; color: #B0ACA5">Usually takes a few seconds. Nothing is logged until you confirm.</div>
    <button type="button" disabled style="height: 56px; border-radius: 18px; border: 0; padding: 0; background: #2C2D31; color: #8A8780; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; cursor: default">Log</button>
  </div>
</div>
</body>
</html>
