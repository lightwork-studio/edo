<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Edo typing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#141517}
button,input{font:inherit;color:inherit;margin:0}
a{color:#F6B84D}a:hover{color:#F9CD80}
.k{width:33px;height:42px;border-radius:6px;background:#46474C;box-shadow:0 1px 0 #0B0B0C;display:flex;align-items:center;justify-content:center;flex:none}
.ks{background:#323337}
.hl{border-radius:6px;padding:1px 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #141517; color: #F4F2EE; font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.3; -webkit-font-smoothing: antialiased">

  <div aria-hidden="true">
    <div style="padding: 8px 12px 0 20px; height: 52px; box-sizing: border-box; display: flex; align-items: center; gap: 8px">
      <span style="flex: 1; display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 700">Wed, 25 Nov <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B0ACA5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span>
      <span style="width: 40px; height: 40px; border-radius: 20px; background: #1F2023"></span>
      <span style="width: 40px; height: 40px; border-radius: 20px; background: #1F2023"></span>
    </div>

    <div style="margin: 10px 12px 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
      <div style="padding: 4px 0; height: 76px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 3px">
        <span style="font-size: 11.5px; font-weight: 600; color: #B0ACA5">M</span>
        <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="#323337" stroke-width="3.5"></circle><circle cx="17" cy="17" r="14" fill="none" stroke="#8A8780" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="85.1 87.96" transform="rotate(-90 17 17)"></circle><text x="17" y="17.5" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F4F2EE">23</text></svg>
        <span style="font-size: 11px; font-weight: 500; color: #B0ACA5">2,080</span>
      </div>
      <div style="padding: 4px 0; height: 76px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 3px">
        <span style="font-size: 11.5px; font-weight: 600; color: #B0ACA5">T</span>
        <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="#8A8780" stroke-width="3.5"></circle><text x="17" y="17.5" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F4F2EE">24</text></svg>
        <span style="font-size: 11px; font-weight: 700">+90</span>
      </div>
      <div style="padding: 4px 0; height: 76px; box-sizing: border-box; border-radius: 14px; background: #1F2023; display: flex; flex-direction: column; align-items: center; gap: 3px">
        <span style="font-size: 11.5px; font-weight: 700; color: #F6B84D">W</span>
        <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="#323337" stroke-width="3.5"></circle><circle cx="17" cy="17" r="14" fill="none" stroke="#F6B84D" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="43.53 87.96" transform="rotate(-90 17 17)"></circle><text x="17" y="17.5" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#F4F2EE">25</text></svg>
        <span style="font-size: 11px; font-weight: 700; color: #F6B84D">today</span>
      </div>
      <div style="padding: 4px 0; height: 76px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 3px">
        <span style="font-size: 11.5px; font-weight: 600; color: #B0ACA5">T</span>
        <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="#323337" stroke-width="3.5"></circle><text x="17" y="17.5" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#B0ACA5">26</text></svg>
      </div>
      <div style="padding: 4px 0; height: 76px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 3px">
        <span style="font-size: 11.5px; font-weight: 600; color: #B0ACA5">F</span>
        <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="#323337" stroke-width="3.5"></circle><text x="17" y="17.5" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#B0ACA5">27</text></svg>
      </div>
      <div style="padding: 4px 0; height: 76px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 3px">
        <span style="font-size: 11.5px; font-weight: 600; color: #B0ACA5">S</span>
        <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="#323337" stroke-width="3.5"></circle><text x="17" y="17.5" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#B0ACA5">28</text></svg>
      </div>
      <div style="padding: 4px 0; height: 76px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 3px">
        <span style="font-size: 11.5px; font-weight: 600; color: #B0ACA5">S</span>
        <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="#323337" stroke-width="3.5"></circle><text x="17" y="17.5" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#B0ACA5">29</text></svg>
      </div>
    </div>

    <div style="margin: 12px 16px 0; background: #1F2023; border-radius: 24px; padding: 16px 16px 14px">
      <div style="display: flex; align-items: center; gap: 18px">
        <svg width="150" height="150" viewBox="0 0 150 150" style="display: block; flex: none">
          <circle cx="75" cy="75" r="66" fill="none" stroke="#2C2D31" stroke-width="14"></circle>
          <circle cx="75" cy="75" r="66" fill="none" stroke="#F6B84D" stroke-width="14" stroke-linecap="round" stroke-dasharray="205.2 414.69" transform="rotate(-90 75 75)"></circle>
          <text x="75" y="69" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.8" fill="#F4F2EE">1,086</text>
          <text x="75" y="92" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#B0ACA5">kcal left</text>
        </svg>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 10px"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="#2C2D31" stroke-width="5"></circle><circle cx="22" cy="22" r="19" fill="none" stroke="#5FD38D" stroke-width="5" stroke-linecap="round" stroke-dasharray="58.1 119.38" transform="rotate(-90 22 22)"></circle></svg><span style="font-size: 17px; font-weight: 700">77 g <span style="font-size: 13px; font-weight: 500; color: #B0ACA5">left</span></span></div>
          <div style="display: flex; align-items: center; gap: 10px"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="#2C2D31" stroke-width="5"></circle><circle cx="22" cy="22" r="19" fill="none" stroke="#E8DD72" stroke-width="5" stroke-linecap="round" stroke-dasharray="70.59 119.38" transform="rotate(-90 22 22)"></circle></svg><span style="font-size: 17px; font-weight: 700">94 g <span style="font-size: 13px; font-weight: 500; color: #B0ACA5">left</span></span></div>
          <div style="display: flex; align-items: center; gap: 10px"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="#2C2D31" stroke-width="5"></circle><circle cx="22" cy="22" r="19" fill="none" stroke="#FF7D8A" stroke-width="5" stroke-linecap="round" stroke-dasharray="35.81 119.38" transform="rotate(-90 22 22)"></circle></svg><span style="font-size: 17px; font-weight: 700">49 g <span style="font-size: 13px; font-weight: 500; color: #B0ACA5">left</span></span></div>
        </div>
      </div>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(8, 9, 10, 0.62)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="type-title" style="position: absolute; left: 8px; right: 8px; bottom: 299px; box-sizing: border-box; border-radius: 30px; background: #232427; border: 1px solid #3A3B40; box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.55); padding: 10px 16px 16px; display: flex; flex-direction: column">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #4A4B50"></span>

    <div style="margin-top: 10px; display: flex; align-items: center; gap: 8px">
      <h2 id="type-title" style="flex: 1; min-width: 0; margin: 0; display: flex; align-items: center; gap: 8px; white-space: nowrap">
        <span style="font-size: 16px; font-weight: 600">Type what you ate</span>
        <button type="button" aria-label="Meal: dinner, picked from the time of day. Change meal" style="height: 32px; border-radius: 16px; border: 0; background: #2C2D31; padding: 0 8px 0 11px; display: flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 600; color: #F4F2EE; cursor: pointer">Dinner<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#B0ACA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
      </h2>
      <button type="button" aria-label="Close" style="width: 36px; height: 36px; flex: none; border-radius: 18px; border: 0; padding: 0; background: #2C2D31; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F4F2EE" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <label for="type-field" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">What did you eat?</label>
    <div id="type-field" role="textbox" aria-multiline="true" contenteditable="true" lang="de" style="margin-top: 12px; min-height: 120px; box-sizing: border-box; padding: 12px 14px; border-radius: 18px; background: #1A1B1D; border: 1.5px solid #F6B84D; outline: none; font-size: 19px; font-weight: 500; line-height: 1.62; letter-spacing: -0.2px">2 Scheiben Vollkornbrot mit Gouda, eine Tomate und ein Glas Apfelschorle<span aria-hidden="true" style="display: inline-block; width: 2px; height: 22px; margin-left: 2px; vertical-align: -4px; border-radius: 1px; background: #F6B84D"></span></div>

    <p style="margin: 10px 4px 0; font-size: 13px; color: #B0ACA5">Edo sorts this into items when you tap Review.</p>

    <div style="margin-top: 14px; display: flex; align-items: center; gap: 10px">
      <button type="button" aria-label="Switch to speaking" style="width: 52px; height: 52px; flex: none; box-sizing: border-box; border-radius: 26px; border: 2px solid #F6B84D; padding: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F6B84D" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg>
      </button>
      <button type="button" style="flex: 1; height: 52px; border-radius: 18px; border: 0; padding: 0; background: #F6B84D; color: #2B1B00; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; cursor: pointer">
        Review
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B1B00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </section>

  <div role="img" aria-label="On-screen keyboard" style="position: absolute; left: 0; right: 0; bottom: 0; height: 291px; box-sizing: border-box; background: #222326; border-top: 1px solid #2C2D31; padding: 0 3px 34px; display: flex; flex-direction: column; font-size: 22px; font-weight: 400; color: #F4F2EE">
    <div style="height: 44px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; font-size: 15px; color: #D4D0C9; text-align: center">
      <span>Apfelschorle</span>
      <span style="border-left: 1px solid #3A3B40; border-right: 1px solid #3A3B40">Apfelsaft</span>
      <span>Apfel</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 11px; padding-top: 2px">
      <div style="display: flex; justify-content: center; gap: 6px">
        <span class="k">q</span><span class="k">w</span><span class="k">e</span><span class="k">r</span><span class="k">t</span><span class="k">z</span><span class="k">u</span><span class="k">i</span><span class="k">o</span><span class="k">p</span>
      </div>
      <div style="display: flex; justify-content: center; gap: 6px">
        <span class="k">a</span><span class="k">s</span><span class="k">d</span><span class="k">f</span><span class="k">g</span><span class="k">h</span><span class="k">j</span><span class="k">k</span><span class="k">l</span>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 0 0">
        <span class="k ks" style="width: 44px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F2EE" stroke-width="1.8" stroke-linejoin="round"><path d="M12 4l8 8h-4.5v7h-7v-7H4z"></path></svg></span>
        <span style="display: flex; gap: 6px"><span class="k">y</span><span class="k">x</span><span class="k">c</span><span class="k">v</span><span class="k">b</span><span class="k">n</span><span class="k">m</span></span>
        <span class="k ks" style="width: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4F2EE" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M8.5 5.5H20v13H8.5L3 12z"></path><path d="M11.5 9.5l5 5M16.5 9.5l-5 5"></path></svg></span>
      </div>
      <div style="display: flex; gap: 6px">
        <span class="k ks" style="width: 44px; font-size: 16px">123</span>
        <span class="k ks" style="width: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4F2EE" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M8.5 14.5a4 4 0 0 0 7 0M9.5 10h.01M14.5 10h.01"></path></svg></span>
        <span class="k" style="flex: 1; width: auto; font-size: 16px">space</span>
        <span class="k ks" style="width: 88px; font-size: 16px">return</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
