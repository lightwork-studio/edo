<style>

</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #141517; color: #F4F2EE; font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.3; -webkit-font-smoothing: antialiased">

        <span style="font-size: 11.5px; font-weight: 700; color: #F6B84D">W</span>
        <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="#323337" stroke-width="3.5"></circle><circle cx="17" cy="17" r="14" fill="none" stroke="#F6B84D" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="43.53 87.96" transform="rotate(-90 17 17)"></circle><text x="17" y="17.5" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#F4F2EE">25</text></svg>

        <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="#323337" stroke-width="3.5"></circle><text x="17" y="17.5" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#B0ACA5">26</text></svg>
      </div>
      <div style="padding: 4px 0; height: 76px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 3px">
        <span style="font-size: 11.5px; font-weight: 600; color: #B0ACA5">F</span>
        <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="#323337" stroke-width="3.5"></circle><text x="17" y="17.5" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#B0ACA5">27</text></svg>
      </div>
      <div style="padding: 4px 0; height: 76px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 3px">
        <span style="font-size: 11.5px; font-weight: 600; color: #B0ACA5">S</span>
        <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="#323337" stroke-width="3.5"></circle><text x="17" y="17.5" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#B0ACA5">28</text></svg>
      </div>
      <div style="padding: 4px 0; height: 76px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 3px">
        <span style="font-size: 11.5px; font-weight: 600; color: #B0ACA5">S</span>
        <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="#323337" stroke-width="3.5"></circle><text x="17" y="17.5" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#B0ACA5">29</text></svg>
      </div>
    </div>

    <div style="margin: 12px 16px 0; background: #1F2023; border-radius: 24px; padding: 16px 16px 14px">
      <div style="display: flex; align-items: center; gap: 18px">
        <svg width="150" height="150" viewBox="0 0 150 150" style="display: block; flex: none">
          <circle cx="75" cy="75" r="66" fill="none" stroke="#2C2D31" stroke-width="14"></circle>
          <circle cx="75" cy="75" r="66" fill="none" stroke="#F6B84D" stroke-width="14" stroke-linecap="round" stroke-dasharray="205.2 414.69" transform="rotate(-90 75 75)"></circle>
          <text x="75" y="69" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.8" fill="#F4F2EE">1,086</text>
          <text x="75" y="92" text-anchor="middle" dominant-baseline="central" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#B0ACA5">kcal left</text>
        </svg>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 10px"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="#2C2D31" stroke-width="5"></circle><circle cx="22" cy="22" r="19" fill="none" stroke="#5FD38D" stroke-width="5" stroke-linecap="round" stroke-dasharray="58.1 119.38" transform="rotate(-90 22 22)"></circle></svg><span style="font-size: 17px; font-weight: 700">77 g <span style="font-size: 13px; font-weight: 500; color: #B0ACA5">left</span></span></div>
          <div style="display: flex; align-items: center; gap: 10px"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="#2C2D31" stroke-width="5"></circle><circle cx="22" cy="22" r="19" fill="none" stroke="#E8DD72" stroke-width="5" stroke-linecap="round" stroke-dasharray="70.59 119.38" transform="rotate(-90 22 22)"></circle></svg><span style="font-size: 17px; font-weight: 700">94 g <span style="font-size: 13px; font-weight: 500; color: #B0ACA5">left</span></span></div>
          <div style="display: flex; align-items: center; gap: 10px"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="#2C2D31" stroke-width="5"></circle><circle cx="22" cy="22" r="19" fill="none" stroke="#FF7D8A" stroke-width="5" stroke-linecap="round" stroke-dasharray="35.81 119.38" transform="rotate(-90 22 22)"></circle></svg><span style="font-size: 17px; font-weight: 700">49 g <span style="font-size: 13px; font-weight: 500; color: #B0ACA5">left</span></span></div>
        </div>
      </div>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(8, 9, 10, 0.62)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="listen-title" style="position: absolute; left: 8px; right: 8px; bottom: 120px; box-sizing: border-box; border-radius: 30px; background: #232427; border: 1px solid #3A3B40; box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.55); padding: 10px 18px 16px; display: flex; flex-direction: column">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #4A4B50"></span>

    <div style="margin-top: 12px; display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="width: 10px; height: 10px; flex: none; border-radius: 5px; background: #F6B84D; box-shadow: 0 0 0 4px #F6B84D29"></span>
      <h2 id="listen-title" style="flex: 1; min-width: 0; margin: 0; display: flex; align-items: center; gap: 6px; white-space: nowrap">
        <span style="font-size: 16px; font-weight: 600">Listening</span>
        <span style="font-size: 13px; font-weight: 400; color: #B0ACA5">adding to</span>
        <button type="button" aria-label="Meal: dinner, picked from the time of day. Change meal" style="height: 32px; border-radius: 16px; border: 0; background: #2C2D31; padding: 0 8px 0 11px; display: flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 600; color: #F4F2EE; cursor: pointer">Dinner<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#B0ACA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
      </h2>
      <span aria-label="Recording time 5 seconds" style="font-size: 13px; font-weight: 600; color: #B0ACA5; font-variant-numeric: tabular-nums">0:05</span>
    </div>

    <p lang="de" aria-live="polite" style="margin: 16px 0 0; min-height: 104px; font-size: 24px; font-weight: 600; letter-spacing: -0.3px; line-height: 1.55">Zwei Scheiben Vollkornbrot mit Gouda, eine Tomate <span style="color: #8A8780">und</span><span aria-hidden="true" style="display: inline-block; width: 2px; height: 26px; margin-left: 4px; vertical-align: -5px; border-radius: 1px; background: #F6B84D"></span></p>

    <div role="img" aria-label="Live audio level" style="margin-top: 16px; height: 52px; display: flex; align-items: center; justify-content: center; gap: 3px">
      <span style="width: 3px; height: 6px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 10px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 8px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 14px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 20px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 12px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 8px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 16px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 26px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 18px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 10px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 6px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 12px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 22px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 30px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 24px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 14px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 8px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 18px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 28px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 36px; border-radius: 2px; background: #6A6B70"></span>
      <span style="width: 3px; height: 26px; border-radius: 2px; background: #F6B84D"></span>
      <span style="width: 3px; height: 16px; border-radius: 2px; background: #F6B84D"></span>
      <span style="width: 3px; height: 10px; border-radius: 2px; background: #F6B84D"></span>
      <span style="width: 3px; height: 14px; border-radius: 2px; background: #F6B84D"></span>
      <span style="width: 3px; height: 24px; border-radius: 2px; background: #F6B84D"></span>
      <span style="width: 3px; height: 40px; border-radius: 2px; background: #F6B84D"></span>
      <span style="width: 3px; height: 48px; border-radius: 2px; background: #F6B84D"></span>
      <span style="width: 3px; height: 34px; border-radius: 2px; background: #F6B84D"></span>
      <span style="width: 3px; height: 22px; border-radius: 2px; background: #F6B84D"></span>
      <span style="width: 3px; height: 14px; border-radius: 2px; background: #F6B84D"></span>
      <span style="width: 3px; height: 20px; border-radius: 2px; background: #F6B84D"></span>
      <span style="width: 3px; height: 32px; border-radius: 2px; background: #F6B84D"></span>
      <span style="width: 3px; height: 44px; border-radius: 2px; background: #F6B84D"></span>
      <span style="width: 3px; height: 50px; border-radius: 2px; background: #F6B84D"></span>
      <span style="width: 3px; height: 38px; border-radius: 2px; background: #F6B84D"></span>
      <span style="width: 3px; height: 24px; border-radius: 2px; background: #F6B84D"></span>
      <span style="width: 3px; height: 12px; border-radius: 2px; background: #F6B84D"></span>
      <span style="width: 3px; height: 6px; border-radius: 2px; background: #F6B84D"></span>
    </div>

    <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center">
      <button type="button" style="justify-self: start; height: 48px; border-radius: 24px; border: 0; padding: 0 18px; background: #2C2D31; font-size: 15px; font-weight: 600; color: #F4F2EE; cursor: pointer">Cancel</button>
      <button type="button" aria-label="Stop and review" style="justify-self: center; width: 68px; height: 68px; border-radius: 34px; border: 0; padding: 0; background: #F4F2EE; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 5px; background: #141517"></span>
      </button>
      <button type="button" style="justify-self: end; height: 48px; border-radius: 24px; border: 0; padding: 0 16px 0 13px; background: #2C2D31; display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 600; color: #F4F2EE; cursor: pointer">
        <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F4F2EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"></rect><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M8 14h8"></path></svg>
        Type
      </button>
    </div>
    <span style="margin-top: 12px; text-align: center; font-size: 12px; color: #B0ACA5">Let go or tap stop when you are done. Edo then sorts it into items for you to check.</span>
  </section>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 0 4px 26px; background: #1A1B1D; border-top: 1px solid #2C2D31; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start">
    <button type="button" aria-current="page" style="height: 56px; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 700; color: #6E6B66; cursor: pointer">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6E6B66" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 3.5V12H3.5"></path></svg>
      Today
    </button>
    <button type="button" style="height: 56px; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: #6E6B66; cursor: pointer">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6E6B66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.5h17a8.5 8 0 0 1-17 0z"></path><path d="M9 8c0-1.5 1-2 1-3.5M13.5 8c0-1.5 1-2 1-3.5"></path></svg>
      Foods
    </button>
    <div style="height: 56px; display: flex; flex-direction: column; align-items: center">
      <button type="button" aria-pressed="true" aria-label="Recording. Release to stop" style="width: 64px; height: 64px; margin-top: -24px; flex: none; border-radius: 32px; border: 0; padding: 0; background: #F6B84D; box-shadow: 0 0 0 5px #1A1B1D, 0 0 0 11px #F6B84D29, 0 0 0 18px #F6B84D12; transform: scale(0.94); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="#2B1B00" stroke="#2B1B00" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path fill="none" d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg>
      </button>
      <span aria-hidden="true" style="margin-top: 3px; font-size: 11px; font-weight: 700; color: #F6B84D">Listening</span>
    </div>
    <button type="button" style="height: 56px; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: #6E6B66; cursor: pointer">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6E6B66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5v15h16"></path><path d="M7.5 15l3.5-4 3 2.5 5-6.5"></path></svg>
      Progress
    </button>
    <button type="button" style="height: 56px; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: #6E6B66; cursor: pointer">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6E6B66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg>
      Profile
    </button>
  </nav>

</body>
</html>
