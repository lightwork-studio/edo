<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Edo recipe editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#141517}
button,input{font:inherit;color:inherit;margin:0}
input::placeholder{color:#B0ACA5;opacity:1}
a{color:#F6B84D}a:hover{color:#F9CD80}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #141517; color: #F4F2EE; font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.3; -webkit-font-smoothing: antialiased">

  <header style="position: relative; padding: 8px 12px 0; height: 60px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between">
    <button type="button" aria-label="Back to foods" style="width: 40px; height: 40px; flex: none; border-radius: 20px; border: 0; padding: 0; background: #1F2023; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F2EE" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <h1 style="position: absolute; left: 80px; right: 80px; top: 8px; height: 52px; margin: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">Edit recipe</h1>
    <button type="button" style="height: 40px; border-radius: 20px; border: 0; padding: 0 16px; background: #1F2023; font-size: 15px; font-weight: 700; color: #F6B84D; cursor: pointer">Done</button>
  </header>

  <main style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 10px">

    <div style="height: 54px; box-sizing: border-box; border-radius: 16px; background: #1F2023; padding: 0 14px; display: flex; align-items: center">
      <label for="r-name" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Recipe name</label>
      <input id="r-name" type="text" lang="de" value="Chili sin Carne" style="flex: 1; min-width: 0; height: 44px; border: 0; outline: none; background: transparent; padding: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.3px; color: #F4F2EE">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div role="group" aria-labelledby="l-serv" style="height: 66px; box-sizing: border-box; border-radius: 16px; background: #1F2023; padding: 8px 8px 8px 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px">
        <span id="l-serv" style="font-size: 12px; color: #B0ACA5">Servings</span>
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="font-size: 20px; font-weight: 700">4</span>
          <span style="display: flex; gap: 4px">
            <button type="button" aria-label="One serving less" style="width: 36px; height: 36px; border-radius: 18px; border: 0; padding: 0; background: #2C2D31; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F4F2EE" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
            <button type="button" aria-label="One serving more" style="width: 36px; height: 36px; border-radius: 18px; border: 0; padding: 0; background: #2C2D31; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F4F2EE" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
          </span>
        </div>
      </div>
      <div style="height: 66px; box-sizing: border-box; border-radius: 16px; background: #1F2023; padding: 8px 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px">
        <label for="r-weight" style="font-size: 12px; color: #B0ACA5">Cooked weight <span style="color: #8A8780">· optional</span></label>
        <div style="display: flex; align-items: baseline; gap: 4px">
          <input id="r-weight" type="text" inputmode="decimal" value="2,000" style="width: 64px; height: 32px; border: 0; outline: none; background: transparent; padding: 0; font-size: 20px; font-weight: 700; color: #F4F2EE">
          <span style="font-size: 14px; font-weight: 600; color: #B0ACA5">g</span>
          <span style="margin-left: auto; font-size: 12px; color: #B0ACA5; white-space: nowrap">500 g each</span>
        </div>
      </div>
    </div>

    <section aria-label="Per serving" style="border-radius: 16px; background: #1F2023; padding: 12px 16px; display: flex; align-items: center; gap: 14px">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 26px; font-weight: 700; letter-spacing: -0.6px">481 <span style="font-size: 14px; font-weight: 500; color: #B0ACA5">kcal</span></span>
        <span style="font-size: 12px; color: #B0ACA5">per serving · 500 g</span>
      </span>
      <ul aria-label="Macros per serving" style="list-style: none; margin: 0; padding: 0; display: flex; gap: 14px">
        <li style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 16px; font-weight: 700">18 g</span><span style="display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: #B0ACA5"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 4px; background: #5FD38D"></span>Protein</span></li>
        <li style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 16px; font-weight: 700">81 g</span><span style="display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: #B0ACA5"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 4px; background: #E8DD72"></span>Carbs</span></li>
        <li style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 16px; font-weight: 700">7 g</span><span style="display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: #B0ACA5"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 4px; background: #FF7D8A"></span>Fat</span></li>
      </ul>
    </section>

    <section aria-labelledby="h-ingr" style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 2px 4px 0">
        <h2 id="h-ingr" style="margin: 0; font-size: 15px; font-weight: 600">Ingredients <span style="font-weight: 400; color: #B0ACA5">· 9</span></h2>
        <span style="font-size: 15px; font-weight: 700">1,924 <span style="font-size: 13px; font-weight: 400; color: #B0ACA5">kcal total</span></span>
      </div>

      <ul style="list-style: none; margin: 0; padding: 0 0 0; border-radius: 18px; background: #1F2023; overflow: hidden">
        <li style="height: 50px; box-sizing: border-box; padding: 0 14px 0 6px; display: flex; align-items: center; gap: 8px">
          <button type="button" aria-label="Reorder Kidneybohnen" style="width: 28px; height: 44px; flex: none; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: grab"><svg aria-hidden="true" width="12" height="18" viewBox="0 0 12 18" fill="#5E5F65"><circle cx="3" cy="3" r="1.6"></circle><circle cx="9" cy="3" r="1.6"></circle><circle cx="3" cy="9" r="1.6"></circle><circle cx="9" cy="9" r="1.6"></circle><circle cx="3" cy="15" r="1.6"></circle><circle cx="9" cy="15" r="1.6"></circle></svg></button>
          <span lang="de" style="flex: 1; min-width: 0; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Kidneybohnen, abgetropft</span>
          <button type="button" aria-label="Kidneybohnen amount: 480 g. Change" style="height: 30px; flex: none; border-radius: 15px; border: 0; background: #2C2D31; padding: 0 8px 0 10px; display: flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 600; color: #F4F2EE; cursor: pointer; white-space: nowrap">480 g<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B0ACA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
          <span style="width: 38px; flex: none; text-align: right; font-size: 15px; font-weight: 600">480</span>
        </li>
        <li style="height: 50px; box-sizing: border-box; padding: 0 14px 0 6px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #292A2E">
          <button type="button" aria-label="Reorder Mais" style="width: 28px; height: 44px; flex: none; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: grab"><svg aria-hidden="true" width="12" height="18" viewBox="0 0 12 18" fill="#5E5F65"><circle cx="3" cy="3" r="1.6"></circle><circle cx="9" cy="3" r="1.6"></circle><circle cx="3" cy="9" r="1.6"></circle><circle cx="9" cy="9" r="1.6"></circle><circle cx="3" cy="15" r="1.6"></circle><circle cx="9" cy="15" r="1.6"></circle></svg></button>
          <span lang="de" style="flex: 1; min-width: 0; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Mais, abgetropft</span>
          <button type="button" aria-label="Mais amount: 285 g. Change" style="height: 30px; flex: none; border-radius: 15px; border: 0; background: #2C2D31; padding: 0 8px 0 10px; display: flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 600; color: #F4F2EE; cursor: pointer; white-space: nowrap">285 g<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B0ACA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
          <span style="width: 38px; flex: none; text-align: right; font-size: 15px; font-weight: 600">228</span>
        </li>
        <li style="height: 50px; box-sizing: border-box; padding: 0 14px 0 6px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #292A2E">
          <button type="button" aria-label="Reorder Passierte Tomaten" style="width: 28px; height: 44px; flex: none; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: grab"><svg aria-hidden="true" width="12" height="18" viewBox="0 0 12 18" fill="#5E5F65"><circle cx="3" cy="3" r="1.6"></circle><circle cx="9" cy="3" r="1.6"></circle><circle cx="3" cy="9" r="1.6"></circle><circle cx="9" cy="9" r="1.6"></circle><circle cx="3" cy="15" r="1.6"></circle><circle cx="9" cy="15" r="1.6"></circle></svg></button>
          <span lang="de" style="flex: 1; min-width: 0; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Passierte Tomaten</span>
          <button type="button" aria-label="Passierte Tomaten amount: 500 g. Change" style="height: 30px; flex: none; border-radius: 15px; border: 0; background: #2C2D31; padding: 0 8px 0 10px; display: flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 600; color: #F4F2EE; cursor: pointer; white-space: nowrap">500 g<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B0ACA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
          <span style="width: 38px; flex: none; text-align: right; font-size: 15px; font-weight: 600">125</span>
        </li>
        <li style="position: relative; height: 50px; border-top: 1px solid #292A2E; background: #C9433F; overflow: hidden">
          <button type="button" aria-label="Delete Zwiebel" style="position: absolute; right: 0; top: 0; width: 80px; height: 50px; border: 0; padding: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; color: #FFFFFF; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15M10 11v6M14 11v6M6.5 7l1 12.5h9l1-12.5M9.5 7V4.5h5V7"></path></svg>Delete</button>
          <div style="position: absolute; left: -80px; top: 0; width: 358px; height: 50px; box-sizing: border-box; padding: 0 14px 0 6px; background: #252629; display: flex; align-items: center; gap: 8px; box-shadow: 6px 0 12px rgba(0, 0, 0, 0.35)">
            <span aria-hidden="true" style="width: 28px; flex: none"></span>
            <span lang="de" style="flex: 1; min-width: 0; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Zwiebel</span>
            <span style="height: 30px; flex: none; border-radius: 15px; background: #2C2D31; padding: 0 10px; display: flex; align-items: center; font-size: 13px; font-weight: 600; white-space: nowrap">150 g</span>
            <span style="width: 38px; flex: none; text-align: right; font-size: 15px; font-weight: 600">42</span>
          </div>
        </li>
        <li style="height: 50px; box-sizing: border-box; padding: 0 14px 0 6px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #292A2E">
          <button type="button" aria-label="Reorder Paprika rot" style="width: 28px; height: 44px; flex: none; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: grab"><svg aria-hidden="true" width="12" height="18" viewBox="0 0 12 18" fill="#5E5F65"><circle cx="3" cy="3" r="1.6"></circle><circle cx="9" cy="3" r="1.6"></circle><circle cx="3" cy="9" r="1.6"></circle><circle cx="9" cy="9" r="1.6"></circle><circle cx="3" cy="15" r="1.6"></circle><circle cx="9" cy="15" r="1.6"></circle></svg></button>
          <span lang="de" style="flex: 1; min-width: 0; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Paprika rot</span>
          <button type="button" aria-label="Paprika rot amount: 200 g. Change" style="height: 30px; flex: none; border-radius: 15px; border: 0; background: #2C2D31; padding: 0 8px 0 10px; display: flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 600; color: #F4F2EE; cursor: pointer; white-space: nowrap">200 g<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B0ACA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
          <span style="width: 38px; flex: none; text-align: right; font-size: 15px; font-weight: 600">74</span>
        </li>
        <li style="height: 50px; box-sizing: border-box; padding: 0 14px 0 6px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #292A2E">
          <button type="button" aria-label="Reorder Olivenöl" style="width: 28px; height: 44px; flex: none; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: grab"><svg aria-hidden="true" width="12" height="18" viewBox="0 0 12 18" fill="#5E5F65"><circle cx="3" cy="3" r="1.6"></circle><circle cx="9" cy="3" r="1.6"></circle><circle cx="3" cy="9" r="1.6"></circle><circle cx="9" cy="9" r="1.6"></circle><circle cx="3" cy="15" r="1.6"></circle><circle cx="9" cy="15" r="1.6"></circle></svg></button>
          <span lang="de" style="flex: 1; min-width: 0; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Olivenöl</span>
          <button type="button" aria-label="Olivenöl amount: 20 g, 2 tablespoons. Change" style="height: 30px; flex: none; border-radius: 15px; border: 0; background: #2C2D31; padding: 0 8px 0 10px; display: flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 600; color: #F4F2EE; cursor: pointer; white-space: nowrap">2 tbsp<span style="font-weight: 400; color: #B0ACA5">· 20 g</span><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B0ACA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
          <span style="width: 38px; flex: none; text-align: right; font-size: 15px; font-weight: 600">177</span>
        </li>
        <li style="border-top: 1px solid #292A2E">
          <button type="button" aria-label="Show 3 more ingredients: Reis gekocht, Knoblauch, Gewürze" style="width: 100%; height: 44px; border: 0; background: none; padding: 0 14px 0 42px; display: flex; align-items: center; gap: 8px; text-align: left; cursor: pointer">
            <span lang="de" style="flex: 1; min-width: 0; font-size: 13px; color: #B0ACA5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">+ 3 more · Reis gekocht, Knoblauch, Gewürze</span>
            <span style="font-size: 13px; font-weight: 600; color: #B0ACA5">798</span>
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B0ACA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
        </li>
      </ul>

      <div style="height: 52px; box-sizing: border-box; border-radius: 18px; border: 1.5px dashed #3A3B40; padding: 0 6px 0 8px; display: flex; align-items: center; gap: 4px">
        <button type="button" style="flex: 1; min-width: 0; height: 44px; border: 0; background: none; padding: 0 6px; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: #F4F2EE; text-align: left; cursor: pointer">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F6B84D" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          Add ingredient
        </button>
        <button type="button" aria-label="Add ingredients by speaking" style="width: 40px; height: 40px; flex: none; border-radius: 20px; border: 0; padding: 0; background: #1F2023; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F6B84D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg></button>
        <button type="button" aria-label="Add an ingredient by barcode" style="width: 40px; height: 40px; flex: none; border-radius: 20px; border: 0; padding: 0; background: #1F2023; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F4F2EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M8 8.5v7M11 8.5v7M13.5 8.5v7M16 8.5v7"></path></svg></button>
      </div>
    </section>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 34px; background: #141517; border-top: 1px solid #232427; box-shadow: 0 -16px 24px #141517">
    <button type="button" style="width: 100%; height: 56px; border-radius: 18px; border: 0; padding: 0; background: #F6B84D; color: #2B1B00; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; cursor: pointer">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B1B00" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      Log 1 serving · 481 kcal
    </button>
  </div>
</div>
</body>
</html>
