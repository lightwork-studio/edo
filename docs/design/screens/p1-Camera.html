<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Edo photo camera</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#141517}
button,input{font:inherit;color:inherit;margin:0}
a{color:#F6B84D}a:hover{color:#F9CD80}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #0B0B0C; color: #F4F2EE; font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.3; -webkit-font-smoothing: antialiased">

ath><path d="M118 190 C108 150 160 112 206 128"></path><path d="M126 204 C150 222 206 214 222 180"></path><path d="M140 214 C112 196 112 150 140 132"></path><path d="M150 120 C196 110 232 150 214 196"></path><path d="M120 176 C140 222 196 226 216 196"></path><path d="M134 140 C168 120 214 140 220 168"></path><path d="M128 196 C150 166 200 176 214 208"></path><path d="M146 126 C130 150 134 196 166 216"></path><path d="M196 122 C226 140 228 186 200 212"></path><path d="M116 160 C130 196 170 214 204 206"></path></g><g fill="none" stroke="#EDD08A" stroke-width="2" stroke-linecap="round"><path d="M124 178 C140 206 186 210 208 190"></path><path d="M130 150 C150 128 192 128 208 150"></path></g><path d="M146 146 C150 128 178 124 192 136 C206 146 204 170 192 180 C178 192 152 188 144 174 C138 164 142 154 146 146 Z" fill="#A8452E"></path><g fill="#7E2F1F"><circle cx="160" cy="150" r="4"></circle><circle cx="182" cy="162" r="4.5"></circle><circle cx="168" cy="174" r="3.5"></circle><circle cx="186" cy="144" r="3"></circle><circle cx="152" cy="166" r="3"></circle></g><g fill="#C8613F"><circle cx="172" cy="142" r="3"></circle><circle cx="176" cy="180" r="2.5"></circle><circle cx="194" cy="158" r="2.5"></circle></g><g fill="#F7F1DF"><rect x="164" y="156" width="5" height="3" rx="1"></rect><rect x="175" y="150" width="4" height="3" rx="1"></rect><rect x="158" y="162" width="4" height="2.5" rx="1"></rect><rect x="180" y="168" width="5" height="3" rx="1"></rect><rect x="170" y="164" width="4" height="2.5" rx="1"></rect><rect x="186" y="154" width="4" height="3" rx="1"></rect><rect x="166" y="146" width="3" height="2.5" rx="1"></rect></g><ellipse cx="178" cy="138" rx="7" ry="4" fill="#4F8A3A" transform="rotate(-25 178 138)"></ellipse><ellipse cx="188" cy="140" rx="6" ry="3.5" fill="#5E9A45" transform="rotate(30 188 140)"></ellipse></svg>
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 130px; background: linear-gradient(to bottom, rgba(11, 11, 12, 0.75), rgba(11, 11, 12, 0))"></div>
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(to top, rgba(11, 11, 12, 0.85), rgba(11, 11, 12, 0))"></div>
    <svg aria-hidden="true" width="390" height="652" viewBox="0 0 390 652" style="position: absolute; left: 0; top: 0">
      <g fill="none" stroke="#F4F2EE" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round">
        <path d="M34 196V164a14 14 0 0 1 14-14h32"></path>
        <path d="M310 150h32a14 14 0 0 1 14 14v32"></path>
        <path d="M356 470v32a14 14 0 0 1-14 14h-32"></path>
        <path d="M80 516H48a14 14 0 0 1-14-14v-32"></path>
      </g>
    </svg>
  </div>

  <header style="position: absolute; left: 0; right: 0; top: 0; padding: 8px 12px 0; height: 60px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between">
    <button type="button" aria-label="Close camera" style="width: 40px; height: 40px; flex: none; border-radius: 20px; border: 0; padding: 0; background: rgba(20, 21, 23, 0.6); display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F2EE" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <button type="button" aria-label="Meal: dinner, picked from the time of day. Change meal" style="height: 36px; border-radius: 18px; border: 0; background: rgba(20, 21, 23, 0.6); padding: 0 10px 0 14px; display: flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 700; color: #F4F2EE; cursor: pointer">Dinner<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B0ACA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
    <button type="button" aria-pressed="false" aria-label="Flash off" style="width: 40px; height: 40px; flex: none; border-radius: 20px; border: 0; padding: 0; background: rgba(20, 21, 23, 0.6); display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F4F2EE" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"></path><path d="M3.5 3.5l17 17"></path></svg>
    </button>
  </header>

  <p role="note" style="position: absolute; left: 50%; top: 560px; transform: translateX(-50%); margin: 0; height: 34px; box-sizing: border-box; padding: 0 14px; border-radius: 17px; background: rgba(20, 21, 23, 0.72); display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 13px; font-weight: 600; color: #F4F2EE">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F6B84D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="3.5"></circle></svg>
    Get the whole plate in view
  </p>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 192px; box-sizing: border-box; padding: 18px 28px 34px; background: #0B0B0C; display: flex; flex-direction: column; gap: 14px">
    <p style="margin: 0; text-align: center; font-size: 12px; color: #B0ACA5">Edo finds each food and guesses the amounts. You check them next.</p>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center">
      <div style="justify-self: start; display: flex; flex-direction: column; align-items: center; gap: 5px">
        <button type="button" aria-label="Choose a photo from your library" style="width: 52px; height: 52px; border-radius: 14px; border: 1px solid #3A3B40; padding: 0; background: #1F2023; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4F2EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M4 17l5-4.5 4 3.5 3-2.5 4.5 3.5"></path></svg>
        </button>
        <span aria-hidden="true" style="font-size: 11px; font-weight: 500; color: #B0ACA5">Library</span>
      </div>
      <button type="button" aria-label="Take photo" style="justify-self: center; width: 78px; height: 78px; border-radius: 39px; border: 4px solid #F4F2EE; padding: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <span aria-hidden="true" style="width: 62px; height: 62px; border-radius: 31px; background: #F4F2EE"></span>
      </button>
      <div style="justify-self: end; display: flex; flex-direction: column; align-items: center; gap: 5px">
        <button type="button" aria-label="Add a note to the photo, by voice or typing. For example: half portion, with parmesan" style="width: 52px; height: 52px; border-radius: 26px; border: 0; padding: 0; background: #1F2023; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F6B84D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg>
        </button>
        <span aria-hidden="true" style="font-size: 11px; font-weight: 500; color: #B0ACA5">Add note</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
