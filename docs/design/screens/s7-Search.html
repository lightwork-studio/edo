<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Edo food search</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#141517}
button,input{font:inherit;color:inherit;margin:0}
input::placeholder{color:#B0ACA5;opacity:1}
a{color:#F6B84D}a:hover{color:#F9CD80}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #141517; color: #F4F2EE; font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.3; -webkit-font-smoothing: antialiased">

  <header style="position: relative; padding: 8px 12px 0; height: 60px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between">
    <button type="button" aria-label="Close search" style="width: 40px; height: 40px; flex: none; border-radius: 20px; border: 0; padding: 0; background: #1F2023; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F2EE" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <div style="position: absolute; left: 64px; right: 64px; top: 8px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center">
      <button type="button" aria-label="Adding to dinner. Change meal" style="height: 26px; border: 0; background: none; padding: 0; display: flex; align-items: center; gap: 5px; font-size: 17px; font-weight: 700; color: #F4F2EE; cursor: pointer">
        Add to Dinner
        <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B0ACA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <span style="font-size: 12px; color: #B0ACA5">1,086 kcal left today</span>
    </div>
    <span aria-hidden="true" style="width: 40px"></span>
  </header>

  <form role="search" aria-label="Search foods" style="margin: 10px 16px 0; display: flex; align-items: center; gap: 8px">
    <div style="flex: 1; min-width: 0; height: 50px; box-sizing: border-box; border-radius: 25px; background: #1F2023; border: 1.5px solid #F6B84D; padding: 0 6px 0 14px; display: flex; align-items: center; gap: 8px">
      <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B0ACA5" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Search foods</label>
      <input id="q" type="search" value="skyr" autofocus style="flex: 1; min-width: 0; height: 40px; border: 0; outline: none; background: transparent; padding: 0; font-size: 17px; font-weight: 500; color: #F4F2EE">
      <button type="button" aria-label="Clear search" style="width: 36px; height: 36px; flex: none; border-radius: 18px; border: 0; padding: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <span style="width: 20px; height: 20px; border-radius: 10px; background: #3A3B40; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#F4F2EE" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
      </button>
    </div>
    <button type="button" aria-label="Scan a barcode" style="width: 50px; height: 50px; flex: none; border-radius: 25px; border: 0; padding: 0; background: #1F2023; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4F2EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M8 8.5v7M11 8.5v7M13.5 8.5v7M16 8.5v7"></path></svg>
    </button>
    <button type="button" aria-label="Say it instead" style="width: 50px; height: 50px; flex: none; box-sizing: border-box; border-radius: 25px; border: 0; padding: 0; background: #F6B84D29; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F6B84D" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg>
    </button>
  </form>

  <div role="tablist" aria-label="Filter results" style="margin: 14px 16px 0; display: flex; gap: 8px">
    <button type="button" role="tab" aria-selected="true" style="height: 36px; border-radius: 18px; border: 0; padding: 0 14px; background: #F4F2EE; color: #141517; font-size: 14px; font-weight: 700; cursor: pointer">All</button>
    <button type="button" role="tab" aria-selected="false" style="height: 36px; border-radius: 18px; border: 1px solid #3A3B40; padding: 0 14px; background: none; color: #F4F2EE; font-size: 14px; font-weight: 600; cursor: pointer">Recent</button>
    <button type="button" role="tab" aria-selected="false" style="height: 36px; border-radius: 18px; border: 1px solid #3A3B40; padding: 0 14px; background: none; color: #F4F2EE; font-size: 14px; font-weight: 600; cursor: pointer">My foods</button>
    <button type="button" role="tab" aria-selected="false" style="height: 36px; border-radius: 18px; border: 1px solid #3A3B40; padding: 0 14px; background: none; color: #F4F2EE; font-size: 14px; font-weight: 600; cursor: pointer">Recipes</button>
  </div>

  <main style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 14px">

    <section aria-labelledby="h-yours" style="background: #1F2023; border-radius: 20px; padding: 4px 0">
      <h2 id="h-yours" style="margin: 0; padding: 10px 16px 4px; font-size: 13px; font-weight: 600; color: #B0ACA5">Your foods and recipes</h2>
      <ul style="list-style: none; margin: 0; padding: 0 8px 0 16px">
        <li style="display: flex; align-items: center; gap: 12px; height: 62px">
          <button type="button" aria-label="Skyr natur, Milbona. Open details" style="flex: 1; min-width: 0; height: 62px; border: 0; background: none; padding: 0; display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left">
            <span style="width: 36px; height: 36px; flex: none; border-radius: 11px; background: #292A2E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B0ACA5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.4 11.2a1.5 1.5 0 0 1-1.5 1.3H7.9a1.5 1.5 0 0 1-1.5-1.3z"></path><path d="M4 8h16M8 8l1-3.5h6L16 8"></path></svg></span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Skyr natur</span>
              <span style="font-size: 12px; color: #B0ACA5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Milbona · 150 g · eaten 12×</span>
            </span>
            <span style="font-size: 15px; font-weight: 700">95</span>
          </button>
          <button type="button" aria-label="Add Skyr natur, 150 g, 95 kcal" style="width: 40px; height: 40px; flex: none; border-radius: 20px; border: 0; padding: 0; background: #2C2D31; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F6B84D" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </li>
        <li style="display: flex; align-items: center; gap: 12px; height: 62px; border-top: 1px solid #292A2E">
          <button type="button" aria-label="Skyr-Bowl mit Beeren, your recipe. Open details" style="flex: 1; min-width: 0; height: 62px; border: 0; background: none; padding: 0; display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left">
            <span style="width: 36px; height: 36px; flex: none; border-radius: 11px; background: #F6B84D29; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F6B84D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.5h17a8.5 8 0 0 1-17 0z"></path><path d="M9 8c0-1.5 1-2 1-3.5M13.5 8c0-1.5 1-2 1-3.5"></path></svg></span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Skyr-Bowl mit Beeren</span>
              <span style="font-size: 12px; color: #B0ACA5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Recipe · 4 ingredients · 1 bowl</span>
            </span>
            <span style="font-size: 15px; font-weight: 700">285</span>
          </button>
          <button type="button" aria-label="Add Skyr-Bowl mit Beeren, 1 bowl, 285 kcal" style="width: 40px; height: 40px; flex: none; border-radius: 20px; border: 0; padding: 0; background: #2C2D31; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F6B84D" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </li>
      </ul>
    </section>

    <section aria-labelledby="h-db" style="background: #1F2023; border-radius: 20px; padding: 4px 0">
      <h2 id="h-db" style="margin: 0; padding: 10px 16px 4px; display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #B0ACA5"><span>Database</span><span style="font-weight: 400">kcal per portion</span></h2>
      <ul style="list-style: none; margin: 0; padding: 0 8px 0 16px">
        <li style="display: flex; align-items: center; gap: 12px; height: 58px">
          <button type="button" aria-label="Skyr natur, Arla. Open details" style="flex: 1; min-width: 0; height: 58px; border: 0; background: none; padding: 0; display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Skyr natur</span>
              <span style="font-size: 12px; color: #B0ACA5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Arla · Open Food Facts · 150 g</span>
            </span>
            <span style="font-size: 15px; font-weight: 700">92</span>
          </button>
          <button type="button" aria-label="Add Skyr natur Arla, 150 g, 92 kcal" style="width: 40px; height: 40px; flex: none; border-radius: 20px; border: 0; padding: 0; background: #2C2D31; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F6B84D" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </li>
        <li style="display: flex; align-items: center; gap: 12px; height: 58px; border-top: 1px solid #292A2E">
          <button type="button" aria-label="Skyr, BLS. Open details" style="flex: 1; min-width: 0; height: 58px; border: 0; background: none; padding: 0; display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Skyr, Magerstufe</span>
              <span style="font-size: 12px; color: #B0ACA5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">BLS · 100 g</span>
            </span>
            <span style="font-size: 15px; font-weight: 700">64</span>
          </button>
          <button type="button" aria-label="Add Skyr Magerstufe, 100 g, 64 kcal" style="width: 40px; height: 40px; flex: none; border-radius: 20px; border: 0; padding: 0; background: #2C2D31; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F6B84D" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </li>
        <li style="display: flex; align-items: center; gap: 12px; height: 58px; border-top: 1px solid #292A2E">
          <button type="button" aria-label="Skyr Vanille, Ehrmann. Open details" style="flex: 1; min-width: 0; height: 58px; border: 0; background: none; padding: 0; display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Skyr Vanille</span>
              <span style="font-size: 12px; color: #B0ACA5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Ehrmann · Open Food Facts · 150 g</span>
            </span>
            <span style="font-size: 15px; font-weight: 700">117</span>
          </button>
          <button type="button" aria-label="Add Skyr Vanille, 150 g, 117 kcal" style="width: 40px; height: 40px; flex: none; border-radius: 20px; border: 0; padding: 0; background: #2C2D31; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F6B84D" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </li>
        <li style="display: flex; align-items: center; gap: 12px; height: 58px; border-top: 1px solid #292A2E">
          <button type="button" aria-label="Skyr Heidelbeere, Milbona. Open details" style="flex: 1; min-width: 0; height: 58px; border: 0; background: none; padding: 0; display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Skyr Heidelbeere</span>
              <span style="font-size: 12px; color: #B0ACA5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Milbona · Open Food Facts · 150 g</span>
            </span>
            <span style="font-size: 15px; font-weight: 700">120</span>
          </button>
          <button type="button" aria-label="Add Skyr Heidelbeere, 150 g, 120 kcal" style="width: 40px; height: 40px; flex: none; border-radius: 20px; border: 0; padding: 0; background: #2C2D31; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F6B84D" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </li>
      </ul>
    </section>

    <div style="display: flex; gap: 8px">
      <button type="button" style="flex: 1; height: 48px; border-radius: 16px; border: 1px dashed #4A4B50; background: none; padding: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; color: #F4F2EE; cursor: pointer">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F4F2EE" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        Create food
      </button>
      <button type="button" style="flex: 1; height: 48px; border-radius: 16px; border: 1px dashed #4A4B50; background: none; padding: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; color: #F4F2EE; cursor: pointer">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F4F2EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c.8 3 5 5.2 5 10.3a5 5 0 0 1-10 0c0-2.6 1.4-4.2 2.6-5.3.3 1.7 1 2.6 2 3.1-.2-3 .2-5.6.4-8.1z"></path></svg>
        Quick kcal
      </button>
    </div>
  </main>
</div>
</body>
</html>
