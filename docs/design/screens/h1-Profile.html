<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Edo profile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#141517}
button,input{font:inherit;color:inherit;margin:0}
input::placeholder{color:#8A8780;opacity:1}
a{color:#F6B84D}a:hover{color:#F9CD80}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #141517; color: #F4F2EE; font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.3; -webkit-font-smoothing: antialiased">

  <header style="padding: 8px 12px 0 20px; height: 52px; box-sizing: border-box; display: flex; align-items: center">
    <h1 style="margin: 0; font-size: 17px; font-weight: 700">Profile</h1>
  </header>

  <main style="padding: 12px 16px 0">
    <button type="button" aria-label="Tim. Goal: lose 0.4 kg per week, 2,150 kcal a day. Edit profile" style="width: 100%; box-sizing: border-box; border-radius: 22px; border: 0; background: #1F2023; padding: 14px 14px 14px 14px; display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer">
      <span aria-hidden="true" style="width: 52px; height: 52px; flex: none; border-radius: 26px; background: #F6B84D29; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #F6B84D">T</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 18px; font-weight: 700; color: #F4F2EE">Tim</span>
        <span style="font-size: 13px; color: #B0ACA5">Lose 0.4 kg/week · 2,150 kcal</span>
      </span>
      <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A8780" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
    </button>

    <section aria-labelledby="h-targets" style="margin-top: 18px">
      <h2 id="h-targets" style="margin: 0 0 8px 6px; font-size: 13px; font-weight: 600; color: #B0ACA5">Targets</h2>
      <ul style="list-style: none; margin: 0; padding: 0; border-radius: 18px; background: #1F2023">
        <li>
          <button type="button" aria-label="Daily targets: 2,150 kcal, protein 150 g, carbs 230 g, fat 70 g" style="width: 100%; height: 64px; border: 0; background: none; padding: 0 12px 0 10px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
            <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 10px; background: #292A2E; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4D0C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="4.5"></circle><circle cx="12" cy="12" r="1"></circle></svg></span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 15px; font-weight: 500; color: #F4F2EE">Calories and macros</span>
              <span style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #B0ACA5; white-space: nowrap; font-variant-numeric: tabular-nums">
                <b style="font-weight: 700; color: #F4F2EE">2,150 kcal</b>
                <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 7px; height: 7px; flex: none; border-radius: 4px; background: #5FD38D"></span>P 150</span>
                <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 7px; height: 7px; flex: none; border-radius: 4px; background: #E8DD72"></span>C 230</span>
                <span style="display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 7px; height: 7px; flex: none; border-radius: 4px; background: #FF7D8A"></span>F 70</span>
              </span>
            </span>
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A8780" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </li>
      </ul>
    </section>

    <section aria-labelledby="h-data" style="margin-top: 18px">
      <h2 id="h-data" style="margin: 0 0 8px 6px; font-size: 13px; font-weight: 600; color: #B0ACA5">Data</h2>
      <ul style="list-style: none; margin: 0; padding: 0; border-radius: 18px; background: #1F2023">
        <li>
          <button type="button" aria-label="Sync: managed, synced 2 minutes ago" style="width: 100%; height: 52px; border: 0; background: none; padding: 0 12px 0 10px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
            <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 10px; background: #292A2E; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4D0C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.7"></path><path d="M20 4v4.7h-4.7"></path><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.3"></path><path d="M4 20v-4.7h4.7"></path></svg></span>
            <span style="flex: none; font-size: 15px; font-weight: 500; color: #F4F2EE; white-space: nowrap">Sync</span>
            <span style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 13px; color: #B0ACA5; white-space: nowrap; overflow: hidden"><span style="overflow: hidden; text-overflow: ellipsis"><span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #5FD38D"></span>Managed · synced 2 min ago</span></span></span>
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A8780" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </li>
        <li style="border-top: 1px solid #292A2E">
          <button type="button" aria-label="Apple Health, On" style="width: 100%; height: 52px; border: 0; background: none; padding: 0 12px 0 10px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
            <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 10px; background: #292A2E; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4D0C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19.5s-7.5-4.4-7.5-10A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 2.5c0 5.6-7.5 10-7.5 10z"></path></svg></span>
            <span style="flex: none; font-size: 15px; font-weight: 500; color: #F4F2EE; white-space: nowrap">Apple Health</span>
            <span style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 13px; color: #B0ACA5; white-space: nowrap; overflow: hidden"><span style="overflow: hidden; text-overflow: ellipsis">On</span></span>
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A8780" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </li>
        <li style="border-top: 1px solid #292A2E">
          <button type="button" aria-label="Import from FDDB, CSV export" style="width: 100%; height: 52px; border: 0; background: none; padding: 0 12px 0 10px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
            <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 10px; background: #292A2E; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4D0C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"></path><path d="M4.5 16.5v2a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-2"></path></svg></span>
            <span style="flex: none; font-size: 15px; font-weight: 500; color: #F4F2EE; white-space: nowrap">Import from FDDB</span>
            <span style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 13px; color: #B0ACA5; white-space: nowrap; overflow: hidden"><span style="overflow: hidden; text-overflow: ellipsis">CSV export</span></span>
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A8780" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </li>
        <li style="border-top: 1px solid #292A2E">
          <button type="button" aria-label="Export data, CSV, JSON" style="width: 100%; height: 52px; border: 0; background: none; padding: 0 12px 0 10px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
            <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 10px; background: #292A2E; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4D0C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"></path><path d="M4.5 16.5v2a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-2"></path></svg></span>
            <span style="flex: none; font-size: 15px; font-weight: 500; color: #F4F2EE; white-space: nowrap">Export data</span>
            <span style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 13px; color: #B0ACA5; white-space: nowrap; overflow: hidden"><span style="overflow: hidden; text-overflow: ellipsis">CSV, JSON</span></span>
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A8780" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </li>
      </ul>
    </section>

    <section aria-labelledby="h-aiampagents" style="margin-top: 18px">
      <h2 id="h-aiampagents" style="margin: 0 0 8px 6px; font-size: 13px; font-weight: 600; color: #B0ACA5">AI &amp; agents</h2>
      <ul style="list-style: none; margin: 0; padding: 0; border-radius: 18px; background: #1F2023">
        <li>
          <button type="button" aria-label="MCP access, 2 tokens" style="width: 100%; height: 52px; border: 0; background: none; padding: 0 12px 0 10px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
            <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 10px; background: #292A2E; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4D0C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3.5v4M15 3.5v4"></path><path d="M6.5 7.5h11v3a5.5 5.5 0 0 1-11 0z"></path><path d="M12 16v4.5"></path></svg></span>
            <span style="flex: none; font-size: 15px; font-weight: 500; color: #F4F2EE; white-space: nowrap">MCP access</span>
            <span style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 13px; color: #B0ACA5; white-space: nowrap; overflow: hidden"><span style="overflow: hidden; text-overflow: ellipsis">2 tokens</span></span>
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A8780" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </li>
        <li style="border-top: 1px solid #292A2E">
          <button type="button" aria-label="AI features, Included with managed sync" style="width: 100%; height: 52px; border: 0; background: none; padding: 0 12px 0 10px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
            <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 10px; background: #292A2E; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4D0C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l1.8 4.6L18.5 10l-4.7 1.6L12 16.5l-1.8-4.9L5.5 10l4.7-1.4z"></path><path d="M18.5 16.5l.7 1.6 1.6.7-1.6.6-.7 1.6-.7-1.6-1.6-.6 1.6-.7z"></path></svg></span>
            <span style="flex: none; font-size: 15px; font-weight: 500; color: #F4F2EE; white-space: nowrap">AI features</span>
            <span style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 13px; color: #B0ACA5; white-space: nowrap; overflow: hidden"><span style="overflow: hidden; text-overflow: ellipsis">Included with managed sync</span></span>
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A8780" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </li>
      </ul>
    </section>

    <section aria-labelledby="h-app" style="margin-top: 18px">
      <h2 id="h-app" style="margin: 0 0 8px 6px; font-size: 13px; font-weight: 600; color: #B0ACA5">App</h2>
      <ul style="list-style: none; margin: 0; padding: 0; border-radius: 18px; background: #1F2023">
        <li>
          <button type="button" aria-label="Language, English" style="width: 100%; height: 52px; border: 0; background: none; padding: 0 12px 0 10px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
            <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 10px; background: #292A2E; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4D0C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M3.5 12h17M12 3.5c2.5 2.6 3.5 5.4 3.5 8.5s-1 5.9-3.5 8.5c-2.5-2.6-3.5-5.4-3.5-8.5s1-5.9 3.5-8.5z"></path></svg></span>
            <span style="flex: none; font-size: 15px; font-weight: 500; color: #F4F2EE; white-space: nowrap">Language</span>
            <span style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 13px; color: #B0ACA5; white-space: nowrap; overflow: hidden"><span style="overflow: hidden; text-overflow: ellipsis">English</span></span>
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A8780" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </li>
        <li style="border-top: 1px solid #292A2E">
          <button type="button" aria-label="Units, kg · kcal" style="width: 100%; height: 52px; border: 0; background: none; padding: 0 12px 0 10px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
            <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 10px; background: #292A2E; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4D0C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"></rect><path d="M8.5 10a4.5 4.5 0 0 1 7 0l-2.5 2.5"></path></svg></span>
            <span style="flex: none; font-size: 15px; font-weight: 500; color: #F4F2EE; white-space: nowrap">Units</span>
            <span style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 13px; color: #B0ACA5; white-space: nowrap; overflow: hidden"><span style="overflow: hidden; text-overflow: ellipsis">kg · kcal</span></span>
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A8780" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </li>
        <li style="border-top: 1px solid #292A2E">
          <button type="button" aria-label="Meal times: breakfast until 10:30 and more" style="width: 100%; height: 52px; border: 0; background: none; padding: 0 12px 0 10px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
            <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 10px; background: #292A2E; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4D0C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg></span>
            <span style="flex: none; font-size: 15px; font-weight: 500; color: #F4F2EE; white-space: nowrap">Meal times</span>
            <span style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 13px; color: #B0ACA5; white-space: nowrap; overflow: hidden"><span style="overflow: hidden; text-overflow: ellipsis">Breakfast until 10:30 …</span></span>
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A8780" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </li>
      </ul>
    </section>

    <section aria-labelledby="h-about" style="margin-top: 18px">
      <h2 id="h-about" style="margin: 0 0 8px 6px; font-size: 13px; font-weight: 600; color: #B0ACA5">About</h2>
      <ul style="list-style: none; margin: 0; padding: 0; border-radius: 18px; background: #1F2023">
        <li>
          <button type="button" aria-label="About Edo, Version 0.1 · open source" style="width: 100%; height: 52px; border: 0; background: none; padding: 0 12px 0 10px; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
            <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 10px; background: #292A2E; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4D0C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5M12 8h.01"></path></svg></span>
            <span style="flex: none; font-size: 15px; font-weight: 500; color: #F4F2EE; white-space: nowrap">About Edo</span>
            <span style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 13px; color: #B0ACA5; white-space: nowrap; overflow: hidden"><span style="overflow: hidden; text-overflow: ellipsis">Version 0.1 · open source</span></span>
            <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A8780" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </li>
      </ul>
    </section>

    <div aria-hidden="true" style="height: 120px"></div>
  </main>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 84px; height: 72px; background: linear-gradient(to bottom, rgba(20, 21, 23, 0), #141517); pointer-events: none"></div>
  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 0 4px 26px; background: #1A1B1D; border-top: 1px solid #2C2D31; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start">
    <button type="button" style="height: 56px; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: #B0ACA5; cursor: pointer">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B0ACA5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 3.5V12H3.5"></path></svg>
      Today
    </button>
    <button type="button" style="height: 56px; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: #B0ACA5; cursor: pointer">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B0ACA5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.5h17a8.5 8 0 0 1-17 0z"></path><path d="M9 8c0-1.5 1-2 1-3.5M13.5 8c0-1.5 1-2 1-3.5"></path></svg>
      Foods
    </button>
    <div style="height: 56px; display: flex; flex-direction: column; align-items: center">
      <button type="button" aria-label="Log food: hold to speak, tap to type" style="width: 64px; height: 64px; margin-top: -24px; flex: none; border-radius: 32px; border: 0; padding: 0; background: #F6B84D; box-shadow: 0 0 0 5px #1A1B1D, 0 10px 24px rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2B1B00" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg>
      </button>
