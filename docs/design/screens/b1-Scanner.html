    </button>
    <button type="button" aria-label="Adding to dinner. Change meal" style="height: 40px; border-radius: 20px; border: 0; padding: 0 12px 0 16px; background: rgba(20, 21, 23, 0.72); display: flex; align-items: center; gap: 5px; font-size: 15px; font-weight: 700; color: #F4F2EE; cursor: pointer">
      Dinner
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B0ACA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <button type="button" aria-label="Torch" aria-pressed="false" style="width: 40px; height: 40px; flex: none; border-radius: 20px; border: 0; padding: 0; background: rgba(20, 21, 23, 0.72); display: flex; align-items: center; justify-content: center; cursor: pointer">

    </button>
  </header>

  <button type="button" style="position: absolute; left: 50%; top: 606px; transform: translateX(-50%); height: 44px; border-radius: 22px; border: 0; padding: 0 16px 0 13px; background: rgba(20, 21, 23, 0.78); display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 14px; font-weight: 600; color: #F4F2EE; cursor: pointer">

    Type the number
  </button>

  <section aria-labelledby="h-recent" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 0 34px; border-radius: 26px 26px 0 0; background: #1F2023; border-top: 1px solid #2C2D31; display: flex; flex-direction: column">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #4A4B50"></span>
    <h2 id="h-recent" style="margin: 12px 20px 10px; font-size: 13px; font-weight: 600; color: #B0ACA5">Recent scans</h2>
    <div style="padding: 0 16px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none">
      <button type="button" aria-label="Add Skyr natur, Milbona again" style="flex: none; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #3A3B40; background: #232427; padding: 0 14px 0 11px; display: flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 14px; font-weight: 600; color: #F4F2EE; cursor: pointer"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F6B84D" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Skyr natur<span style="font-weight: 500; color: #B0ACA5">Milbona</span></button>
      <button type="button" aria-label="Add Haferflocken, Kölln again" style="flex: none; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #3A3B40; background: #232427; padding: 0 14px 0 11px; display: flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 14px; font-weight: 600; color: #F4F2EE; cursor: pointer"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F6B84D" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Haferflocken<span style="font-weight: 500; color: #B0ACA5">Kölln</span></button>
      <button type="button" aria-label="Add Apfelschorle, Lift again" style="flex: none; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #3A3B40; background: #232427; padding: 0 14px 0 11px; display: flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 14px; font-weight: 600; color: #F4F2EE; cursor: pointer"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F6B84D" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Apfelschorle<span style="font-weight: 500; color: #B0ACA5">Lift</span></button>
